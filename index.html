<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>NASA Space Explorer</title>
  <meta name="theme-color" content="#0b3d91" />
  <link rel="manifest" href="manifest.json" />
  <link href="style.css" rel="stylesheet" type="text/css" />
</head>
<body>
  <div class="container">
    <header class="site-header">
      <img src="img/nasa-worm-logo.png" alt="NASA Logo" class="logo" />
      <h1>Space Explorer</h1>
    </header>
    <div class="creator-tag">Created by Richmond Korsah</div>

    <div class="pwa-controls">
      <p id="connectionStatus" class="connection-status" role="status" aria-live="polite" hidden>You are offline. Cached space images remain available.</p>
      <button id="installBtn" type="button" hidden>Install app</button>
      <button id="notificationBtn" type="button">Enable demo notification</button>
    </div>

    <div class="api-panel">
      <label for="apiKeyInput" class="api-label">NASA API key</label>
      <div class="api-controls">
        <input id="apiKeyInput" type="password" placeholder="Enter your NASA API key" autocomplete="off" />
        <button id="saveApiKeyBtn" type="button">Save key</button>
      </div>
    </div>

    <div class="filters">
      <input type="date" id="startDate" />
      <input type="date" id="endDate" />
      <button id="getImagesBtn">Get Space Images</button>
    </div>

    <div id="gallery" class="gallery">
      <div class="placeholder">
        <div class="placeholder-icon">🔭</div>
        <p>Select a date range and click "Get Space Images" to explore the cosmos!</p>
      </div>
    </div>
  </div>

  <!-- Modal for viewing a full-size image + full description -->
  <div id="modal" class="modal hidden">
    <div class="modal-content">
      <button id="modal-close" class="modal-close">&times;</button>
      <div id="modal-body"></div>
    </div>
  </div>

  <script src="js/dateRange.js"></script>
  <script src="js/script.js"></script>
  <script src="js/pwa.js"></script>
</body>
</html>
